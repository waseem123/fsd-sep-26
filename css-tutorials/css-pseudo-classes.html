<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        a:link{
            color: green;
            text-decoration: none;
        }

        a:visited{
            color: deepskyblue;
        }

        a:active{
            color: magenta;
        }

        a:hover{
            color: black;
            font-size: 24px;
            background-color: orange;
        }

        img{
            width: 200px;
        }

        img:hover{
            width: 400px;
        }
    </style>
</head>

<body>
    <p>There are 4 pseudo classes</p>
    <ol>
        <li>Link</li>
        <li>Visited</li>
        <li>Active</li>
        <li>Hover</li>
    </ol>
    <hr>

    <a href="https://www.google.com">Google</a>
    <a href="https://www.amazon.com">Amazon</a>
    <a href="https://www.meesho.com">Meesho</a>

    <hr>
    <img src="berries.jpg" alt="">
</body>

</html>
