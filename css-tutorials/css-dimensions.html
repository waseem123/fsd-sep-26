<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d1{
            background-color: darkgreen;
            color: rgb(240, 207, 59);
            width: 30px;
            height: 300px;
        }

        #d2{
            background-color: darkgreen;
            color: rgb(240, 207, 59);
            width: 25%;
            height: 300px;
        }

        #i1{
            width: 50%;
        }

        #d3{
            background-color: darkgreen;
            color: rgb(240, 207, 59);
            width: 100%;
            height: 300px;
        }

        #i2{
            width: 50%;
        }
    </style>
</head>

<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <img id="i1" src="berries.jpg" alt="">
    
    
    <div id="d3">
        <img src="berries.jpg" id="i2" alt="">
    </div>
</body>

</html>
