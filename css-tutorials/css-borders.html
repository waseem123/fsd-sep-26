<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d1 {
            width: 150px;
            height: 100px;
            border-width: 0.1px;
            border-style: solid;
            border-color: rgb(34, 247, 116);
        }

        #d2 {
            width: 150px;
            height: 100px;
            border-width: 2px;
            border-style: dotted;
            border-color: rgb(34, 247, 116);
        }

        #d3 {
            width: 150px;
            height: 100px;
            border-width: 2px;
            border-style: dashed;
            border-color: rgb(34, 247, 116);
        }

        #d4 {
            width: 150px;
            height: 100px;
            border-width: 5px;
            border-style: double;
            border-color: rgb(34, 247, 116);
        }

        #d5 {
            width: 150px;
            height: 100px;
            border-width: 10px;
            border-style: inset;
            border-color: rgb(34, 247, 116);
        }
        #d6 {
            width: 150px;
            height: 100px;
            border-width: 10px;
            border-style: outset;
            border-color: rgb(34, 247, 116);
        }

        #d7 {
            width: 150px;
            height: 100px;
            border: 2px solid maroon;
        }
    </style>
</head>

<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <div id="d4"></div>
    <div id="d5"></div>
    <div id="d6"></div>

    <div id="d7"></div>
</body>

</html>
